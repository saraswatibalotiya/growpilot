services:
  postgres:
    image: postgres:16
    container_name: growpilot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: growpilot_db
      POSTGRES_USER: growpilot_user
      POSTGRES_PASSWORD: growpilot_password
    ports:
      - "5432:5432"
    volumes:
      - growpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growpilot_user -d growpilot_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai-engine:
    profiles: ["service"]
    build: ./ai-engine
    container_name: growpilot_ai_engine
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - path: ./ai-engine/.env
        required: false
    environment:
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+asyncpg://growpilot_user:growpilot_password@postgres:5432/growpilot_db
      LOAD_MOCK_DATA: "false"
    ports:
      - "127.0.0.1:8001:8001"

  adminer:
    image: adminer:latest
    container_name: growpilot_adminer
    restart: unless-stopped
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    container_name: growpilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - growpilot_redis_data:/data

volumes:
  growpilot_postgres_data:
  growpilot_redis_data: