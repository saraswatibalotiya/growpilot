# Development database for the AI engine ONLY. It is separate from any other GrowPilot database:
# its own container, its own volume, its own port (5433), bound to localhost.
#
#   docker compose up -d        start
#   docker compose down         stop (data is kept in the volume)
#   docker compose down -v      stop AND DELETE the data (development only)
#
# The default password is a development placeholder. Override it: AI_ENGINE_DB_PASSWORD=... docker compose up -d
name: growpilot-ai-engine

services:
  ai-engine-db:
    image: postgres:16
    container_name: growpilot_ai_engine_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: growpilot_ai
      POSTGRES_PASSWORD: ${AI_ENGINE_DB_PASSWORD:-growpilot_ai_dev_only}
      POSTGRES_DB: growpilot_ai
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ai_engine_pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growpilot_ai -d growpilot_ai"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The engine itself, for running it as an internal service next to the NestJS backend:
  #   AI_ENGINE_SERVICE_TOKEN=<long random value> docker compose --profile service up -d --build
  # It listens on localhost only. In a real deployment keep it on a private network with no public route; NestJS is its only caller.
  ai-engine:
    profiles: ["service"]
    build: .
    container_name: growpilot_ai_engine
    restart: unless-stopped
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001"]
    depends_on:
      ai-engine-db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      SERVICE_TOKEN: ${AI_ENGINE_SERVICE_TOKEN:?set AI_ENGINE_SERVICE_TOKEN to a long random value}
      STORAGE_BACKEND: postgres
      DATABASE_URL: postgresql+asyncpg://growpilot_ai:${AI_ENGINE_DB_PASSWORD:-growpilot_ai_dev_only}@ai-engine-db:5432/growpilot_ai
      LOAD_MOCK_DATA: "false"
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:8001:8001"

volumes:
  ai_engine_pgdata:
